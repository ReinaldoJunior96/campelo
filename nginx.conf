# Crawler de preview de link (WhatsApp, Facebook, Twitter, LinkedIn...) não
# roda JavaScript, então nunca veria o título/imagem que a página React seta
# no cliente para um post do blog. Só essas poucas User-Agents conhecidas
# são desviadas para o HTML pré-montado em /api/blog-preview (ver
# server/src/rotas/blogPreview.js); navegador normal segue o caminho de
# sempre, sem nenhuma mudança de comportamento.
map $http_user_agent $bot_blog {
  default "";
  "~*facebookexternalhit|WhatsApp|Twitterbot|LinkedInBot|TelegramBot|Slackbot|Discordbot" "1";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Cabeçalhos de segurança.
  #
  # Moram aqui, e não no proxy da frente, para viajarem junto com a
  # aplicação: o site pode estar atrás do Caddy deste projeto, atrás do
  # proxy que já existe na VPS ou exposto direto numa porta, e em todos os
  # casos a política é a mesma. Um lugar só para manter.
  #
  # HSTS fica de fora de propósito: quem termina TLS é o proxy da frente, e
  # é ele que sabe se a conexão veio por HTTPS. HSTS anunciado numa resposta
  # HTTP é ignorado pelo navegador de qualquer forma.
  #
  # Na CSP, o Font Awesome aparece duas vezes: a folha de estilo é style-src
  # e o .woff2 que ela referencia é font-src. Liberar só um dos dois derruba
  # o ícone sem erro visível na página.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # Upload de imagem passa por aqui. O limite real (8 MB) é do servidor;
  # este precisa ser maior, senão o nginx corta antes e a resposta vira um
  # 413 em HTML que o painel não sabe ler.
  client_max_body_size 12m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # A API e os uploads vão para o container do servidor.
  location /api/ {
    proxy_pass http://api:3333;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # O rate limit do login depende deste cabeçalho para enxergar o IP de
    # verdade em vez do IP do próprio nginx.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass http://api:3333;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # O próprio servidor já devolve Cache-Control immutable: o nome do
    # arquivo é aleatório e nunca é reaproveitado.
  }

  # Atenção ao repetir `add_header` daqui para baixo: um `add_header` dentro
  # de um location DESCARTA todos os do nível do servidor, em vez de somar.
  # Por isso os cabeçalhos de segurança reaparecem nos três locations que
  # definem Cache-Control. Sem essa repetição eles sumiriam justo nas
  # respostas que mais importam.

  # Bundles do Vite. Têm hash no nome, então nunca mudam de conteúdo.
  location /build/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Imagens da marca e o PDF, vindos de public/. O nome é fixo, então um
  # deploy pode trocar o conteúdo: cache curto, sem immutable.
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # O index nunca pode ficar em cache, senão um deploy novo não chega a
  # quem já visitou o site.
  #
  # É o documento onde a CSP de fato vale, então o conjunto inteiro volta
  # aqui: `try_files` em `location /` faz redirecionamento interno para cá,
  # o que refaz o casamento de location. Sem repetir, a home serviria sem
  # nenhuma política.
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  }

  # Post do blog: crawler de preview cai no HTML pré-montado; navegador
  # normal segue para o index e o React resolve, como qualquer outra rota.
  location ~ ^/blog/(?<slug>[A-Za-z0-9-]+)/?$ {
    if ($bot_blog = "1") {
      rewrite ^ /__blog_preview/$slug last;
    }
    try_files $uri /index.html;
  }

  location ~ ^/__blog_preview/(?<slug>[A-Za-z0-9-]+)$ {
    internal;
    proxy_pass http://api:3333/api/blog-preview/$slug;
    proxy_set_header Host $host;
  }

  # SPA: /admin e qualquer outra rota caem no index e o React resolve.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
