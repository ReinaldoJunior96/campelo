services:
  # Sem profile: sobe junto tanto no dev quanto no prod, porque os dois
  # precisam da API para o painel funcionar.
  api:
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3333
      - DADOS_DIR=/dados
    volumes:
      # Banco e uploads. É o único estado do sistema: se você faz backup de
      # uma coisa só neste projeto, faça deste volume.
      - campelo-dados:/dados
    expose:
      - "3333"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3333/api/saude').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  app-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      # O proxy do Vite encaminha /api e /uploads para cá.
      - API_URL=http://api:3333
    depends_on:
      - api

  app-prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  campelo-dados:
